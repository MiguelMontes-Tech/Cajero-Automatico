{% extends "base.html" %}
{% block titulo %}CAMBIAR PIN{% endblock %}
{% block contenido %}
    <form method="POST">
        <label for="actual">PIN actual</label>
        <input type="password" id="actual" name="actual" maxlength="4" required autofocus>

        <label for="nuevo">PIN nuevo (4 dígitos)</label>
        <input type="password" id="nuevo" name="nuevo" maxlength="4" required>

        <label for="confirmar">Confirmar PIN nuevo</label>
        <input type="password" id="confirmar" name="confirmar" maxlength="4" required>

        <button type="submit" class="boton verde">GUARDAR</button>
    </form>
    <a class="boton rojo" href="{{ url_for('menu') }}">Cancelar</a>
{% endblock %}
