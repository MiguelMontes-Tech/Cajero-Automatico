{% extends "base.html" %}
{% block titulo %}BIENVENIDO{% endblock %}
{% block contenido %}
    <p class="subtitulo">Ingrese sus datos para continuar</p>
    <form method="POST">
        <label for="cuenta">Número de cuenta</label>
        <input type="text" id="cuenta" name="cuenta" required autofocus>

        <label for="pin">PIN (4 dígitos)</label>
        <input type="password" id="pin" name="pin" maxlength="4" required>

        <button type="submit" class="boton verde">INGRESAR</button>
    </form>
{% endblock %}
